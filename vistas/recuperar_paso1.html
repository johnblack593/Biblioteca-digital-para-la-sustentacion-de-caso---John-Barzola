{% extends 'plantilla_base.html' %}

{% block title %}Recuperar Contraseña - Biblioteca{% endblock %}

{% block body_class %}login-page{% endblock %}

{% block content %}
<div class="login-card-container">
    <div class="card login-card">
        <h2 class="text-center login-title" style="margin-bottom: 4px;">Recuperar Cuenta</h2>
        <p class="text-center text-muted" style="margin-bottom: 20px; font-size: 0.88rem;">Paso 1: Identificación de usuario</p>
        
        <form action="{{ url_for('auth.recuperar') }}" method="POST" class="book-form">
            <div class="form-group">
                <label for="username">Correo Electrónico o Usuario</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Ingresa tu correo o usuario">
            </div>
            <div class="form-group">
                <label for="cedula">Cédula de Identidad (10 dígitos)</label>
                <input type="text" id="cedula" name="cedula" required 
                       placeholder="Ej. 0912345678" 
                       maxlength="10" minlength="10" pattern="[0-9]{10}" inputmode="numeric"
                       oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);"
                       title="Debe ingresar exactamente 10 dígitos numéricos">
            </div>
            
            <button type="submit" class="btn btn-primary" style="margin-top: 14px; width: 100%; padding: 10px; font-weight: 600;">Continuar</button>
        </form>
        <p class="text-center text-muted" style="margin: 18px 0 0; font-size: 0.85rem; border-top: 1px solid var(--border-subtle); padding-top: 12px;">
            <a href="{{ url_for('auth.login') }}" style="color: var(--text-muted);">&larr; Volver al Login</a>
        </p>
    </div>
</div>
{% endblock %}
