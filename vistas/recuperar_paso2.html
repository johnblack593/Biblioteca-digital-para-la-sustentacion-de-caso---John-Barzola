{% extends 'plantilla_base.html' %}

{% block title %}Nueva Contraseña - Biblioteca{% endblock %}

{% block body_class %}login-page{% endblock %}

{% block content %}
<div class="login-card-container">
    <div class="card login-card">
        <h2 class="text-center login-title" style="margin-bottom: 4px;">Recuperar Cuenta</h2>
        <p class="text-center text-muted" style="margin-bottom: 18px; font-size: 0.88rem;">Paso 2: Pregunta de Seguridad</p>
        
        <form action="{{ url_for('auth.recuperar_paso2') }}" method="POST" class="book-form">
            
            <div style="background-color: var(--primary-light); color: var(--primary-dark); padding: 12px 15px; border-radius: 8px; margin-bottom: 16px; font-weight: 500; font-size: 0.92rem; text-align: center; border: 1px solid #C7D2FE;">
                {{ pregunta }}
            </div>

            <div class="form-group">
                <label for="respuesta_seguridad">Tu Respuesta</label>
                <input type="text" id="respuesta_seguridad" name="respuesta_seguridad" required autofocus placeholder="Ingresa tu respuesta secreta">
            </div>
            
            <div class="form-group">
                <label for="nueva_password">Nueva Contraseña</label>
                <input type="password" id="nueva_password" name="nueva_password" required placeholder="Crea tu nueva contraseña segura">
            </div>
            
            <button type="submit" class="btn btn-primary" style="margin-top: 14px; width: 100%; padding: 10px; font-weight: 600;">Restablecer Contraseña</button>
        </form>
        <p class="text-center text-muted" style="margin: 18px 0 0; font-size: 0.85rem; border-top: 1px solid var(--border-subtle); padding-top: 12px;">
            <a href="{{ url_for('auth.login') }}" style="color: var(--text-muted);">Cancelar</a>
        </p>
    </div>
</div>
{% endblock %}
