{% extends 'plantilla_base.html' %}

{% block title %}Iniciar Sesión - Biblioteca{% endblock %}

{% block body_class %}login-page{% endblock %}

{% block content %}
<div class="login-card-container">
    <div class="card login-card">
        <h2 class="text-center login-title">Iniciar Sesión</h2>

        <form action="{{ url_for('auth.login') }}" method="POST" class="book-form">
            <div class="form-group" style="margin-bottom: 0.9rem;">
                <label for="username" style="margin-bottom: 0.35rem; font-size: 0.85rem;">Correo Electrónico o Usuario</label>
                <input type="text" id="username" name="username" required autofocus placeholder="correo@ejemplo.com o tu usuario" style="padding: 8px 12px;">
            </div>
            <div class="form-group" style="margin-bottom: 1rem;">
                <label for="password" style="margin-bottom: 0.35rem; font-size: 0.85rem;">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="Ingresa tu contraseña" style="width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-family: inherit;">
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px; margin-bottom: 16px;">
                <button type="submit" class="btn btn-primary" style="padding: 9px 18px; font-size: 0.9rem; font-weight: 600;">Entrar a la Biblioteca</button>
                <a href="{{ url_for('auth.recuperar') }}" style="font-size: 0.82rem; color: var(--text-muted); text-decoration: underline;">Olvidé mi contraseña</a>
            </div>
        </form>
        <p class="text-center text-muted" style="margin: 0; font-size: 0.84rem; border-top: 1px solid var(--border-subtle); padding-top: 12px;">
            ¿No tienes cuenta? <a href="{{ url_for('auth.register') }}" style="color: var(--primary-color); font-weight: 600;">Regístrate aquí</a>
        </p>
    </div>
</div>
{% endblock %}
